# ============================================================
# AgentForge Web 容器（nginx）站点配置
# 落地位置：容器内 /etc/nginx/conf.d/default.conf
# ============================================================
# 两件事：
#   ① 把 Vite 产出的 dist/ 当静态站点发出去
#   ② 把 /api/ 转发给 **api 容器**（这就是"容器间用服务名互访"的落点）
#
# ★ 为什么必须有第 ② 件：本项目后端**没有配 CORS**（app/main.py 里搜不到
#   CORSMiddleware），浏览器不允许跨源直连 api 容器 → 必须由 nginx 代理成**同源**。
# ============================================================

server {
    listen       80;
    server_name  _;

    # 静态文件根目录（Dockerfile 把 builder 的 dist/ 拷到这里）
    root  /usr/share/nginx/html;
    index index.html;

    # gzip：产物全是 JS/CSS，压缩收益明显（构建产物 2.53 MB → gzip 后 819 KB）
    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # ---------- ① 静态资源 ----------

    # Vite 的产物 /assets/index-<内容哈希>.js —— 文件名带哈希，
    # 内容一变文件名就变，所以可以放心长缓存（这是"内容寻址"的典型用法）
    # ⚠ 只用 add_header 一处设置：`expires` 与 `add_header` 是两套机制，
    #   同时写会发出**两条** Cache-Control（实测踩过），读起来像是配置冲突。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 反过来：**绝对不能缓存**。
    # 它里面引用的是带哈希的资源名；若缓存了旧 index.html，
    # 浏览器会去要一个已被删掉的旧 JS → 白屏 + 404。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 兜底：路径找不到实体文件就回 index.html。
    # 本项目目前用 useState 切页（没引路由库），深链接用不上；
    # 但将来引入 react-router 后，缺这一行刷新子路由会直接 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- ② /api/ → api 容器 ----------
    #
    # ★★ 这里就是"容器用服务名互访"：`api` 是 docker-compose.yml 里的**服务名**，
    #    compose 自动建的局域网会把它解析成 api 容器的 IP。
    #    写 localhost 是错的 —— 那指 web 容器自己，而 web 里只有 nginx。
    #
    # ★★ proxy_pass 末尾**有没有那个斜杠，是两种完全不同的语义**（经典坑）：
    #      proxy_pass http://api:8000;    ← 原样透传 URI
    #                                        /api/health → http://api:8000/api/health  ✅
    #      proxy_pass http://api:8000/;   ← 用 "/" 替换掉匹配到的 "/api/"
    #                                        /api/health → http://api:8000/health       ❌ 404
    #    本项目后端路由**自带 /api 前缀**（app/main.py: include_router(..., prefix="/api")），
    #    所以**绝不能**让 /api 被替换掉。
    #    ↓ 下面改用「变量形式」写 proxy_pass：变量值里**不带路径**
    #      → 原始 URI 原样透传，与第一种写法语义完全相同。
    #      （用变量不是为了改语义，是为了让 nginx 能重新解析 DNS，理由见内层注释）
    location /api/ {
        # ★★ 让 nginx **周期性重新解析** `api` 这个名字，而不是只在启动时解析一次。
        #    127.0.0.11 = Docker 内置 DNS（固定地址，只存在于自定义网络里）。
        #
        #    为什么必须这么写（**实测踩过**，2026-10-08）：
        #    nginx 对 proxy_pass 里**字面写着**的主机名，只在**配置加载那一刻**
        #    解析一次，把 IP 记死，之后再不重查。
        #    实验：把 api 容器的 IP 由 .2 换成 .4 后，同一个 nginx 仍然打到旧的 .2 →
        #      502，错误日志原文 `upstream: "http://172.25.0.2:8000/api/..."`。
        #    真实后果：`docker compose up -d --build` 重建 api 容器后，
        #    web 会**持续 502**，直到 web 自己也重启一次。
        #
        #    改法 = 「变量 + resolver」：proxy_pass 里一旦出现**变量**，
        #    nginx 就不再启动时解析，改为按 `valid=` 的间隔重新询问 DNS。
        #    ⚠ 变量里不带路径，所以原始 URI（含 /api 前缀）仍原样透传 —— 语义不变。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 将来上 SSE 流式时要补什么（**现在刻意不加**）----------
    # 后端 /api/chat 目前是**非流式** JSON（app/api/chat.py:42），
    # 默认的响应缓冲对它没有影响，所以现在不加这两行 —— 加了也是无效果的配置。
    # 等 PRD 里的 SSE 落地后，进 location /api/ 补：
    #     proxy_buffering off;
    #     proxy_read_timeout 300s;
    # 不加的症状：后端在逐字发，浏览器界面一直空着，直到全部结束才一次性蹦出来。
}
